name: CI
on:
  push:
    branches: ["**"]  # a release tag is checked and built by release.yml, not a second time here
  pull_request:
permissions:
  contents: read
jobs:
  identity:
    # Nothing pushed here may carry a real e-mail address: once on GitHub it can't be removed again. A pull request is
    # checked over its own commits, so the required check means something before the merge too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: commits and tags use noreply addresses
        if: github.event_name == 'push'
        # every tag too (a new one is checked again by release.yml before anything is built); full ref names
        # (refs/tags/...), so no tag name is ever read as an option
        run: git for-each-ref --format='%(refname)' refs/tags | xargs scripts/check-identity.sh --committer HEAD
      - name: the pull request's commits use noreply addresses
        if: github.event_name == 'pull_request'
        env: { BASE: "${{ github.event.pull_request.base.sha }}", HEAD: "${{ github.event.pull_request.head.sha }}" }
        run: scripts/check-identity.sh --committer "$BASE..$HEAD"
  tokens:
    # the generated token files in web/, mobile/ and mac/ match design/tokens/tokens.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }  # no token left in .git for later steps
      - name: design tokens are up to date
        run: make tokens-check
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }  # no token left in .git for later steps
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27" }
      - name: vet and test
        working-directory: server
        run: mkdir -p static && go vet ./... && go test ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }  # no token left in .git for later steps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "26", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: install, type-check, build, test
        working-directory: web
        run: npm ci --ignore-scripts && npm run build && npm test   # no dependency runs code at install time
  mobile:
    # the Android app's TypeScript (it shares web/src/crypto) and its unit tests; the APK is built by android.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }  # no token left in .git for later steps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "26", cache: npm, cache-dependency-path: "mobile/package-lock.json" }
      - name: install, type-check, test
        run: (cd web && npm ci --ignore-scripts) && cd mobile && npm ci --ignore-scripts && npx tsc --noEmit && npm test
  android:
    # The Android app builds (the native module, Media3, ONNX Runtime, JNA, React Native and Expo together), so a
    # dependency update that breaks the build can't merge: the unit tests above never compile it. Debug-signed, no
    # secrets. libsodium.so is a placeholder here: the build only checks it is present, and this APK is never used
    # (the release builds libsodium from its signed source, android.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_DIST: gradle-9.4.1-bin.zip  # the same pinned Gradle as android.yml
      GRADLE_SHA256: 2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "26", package-manager-cache: false }
      - name: JavaScript dependencies and native project
        run: |
          (cd web && npm ci --ignore-scripts)
          cd mobile && npm ci --ignore-scripts
          CF_VERSION=0.0.1 npx expo prebuild --platform android --clean --no-install
          mkdir -p modules/cf-native/android/src/main/jniLibs/arm64-v8a
          : > modules/cf-native/android/src/main/jniLibs/arm64-v8a/libsodium.so
      - name: Gradle only with the pinned hash
        run: |
          props=mobile/android/gradle/wrapper/gradle-wrapper.properties
          grep -qx "distributionUrl=https\\\\://services.gradle.org/distributions/$GRADLE_DIST" "$props" \
            || { echo "the wrapper wants another Gradle: pin its hash here and in android.yml"; grep distributionUrl "$props"; exit 1; }
          echo "distributionSha256Sum=$GRADLE_SHA256" >> "$props"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: { cache-disabled: true, validate-wrappers: true }
      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --parallel --console=plain
  decrypt-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }  # no token left in .git for later steps
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27" }
      - name: vet and test
        working-directory: tools/decrypt
        run: go vet ./... && go test ./...
  e2e:
    # The whole app in a browser: the real image behind HTTPS (Caddy), Playwright, then the leak check
    # that no plaintext reached the server's disk. Same command as on a laptop: make e2e.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }  # no token left in .git for later steps
      - name: end-to-end tests and leak check
        run: make e2e
      - name: move to a new stack with the backup and restore scripts, sign in, decrypt offline
        run: make migration-test
      - name: keep screenshots and traces of failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: e2e-results, path: e2e/test-results, retention-days: 7 }
