# Cipherfilm in one file: the released image, on 127.0.0.1:8080. It needs HTTPS in front: point any reverse proxy
# (Caddy, nginx, Traefik, a Cloudflare Tunnel, Tailscale Serve, ...) at http://127.0.0.1:8080.
# Put the name your proxy serves in .env:
#   PUBLIC_HOSTS=photos.example.com
# then: docker compose up -d && docker compose logs app | grep "FIRST-TIME SETUP"
# Proxy requirements: docs/SELF-HOSTING.md in the repository.
name: cipherfilm

services:
  app:
    image: ghcr.io/basmatiactivist/cipherfilm:${CIPHERFILM_TAG:-2}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"   # loopback only: reachable just through the proxy on this host
    volumes:
      - data:/data
    environment:
      LISTEN_ADDR: ":8080"
      PUBLIC_HOSTS: "${PUBLIC_HOSTS:?set PUBLIC_HOSTS in .env to the name your proxy serves, e.g. photos.example.com}"
      # 1 with exactly ONE proxy in front that adds X-Forwarded-For; 0 behind a chain, a Cloudflare Tunnel or Tailscale Serve
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"   # peers whose X-Forwarded-For is believed; empty: loopback and private

volumes:
  data:
    name: cipherfilm_data
