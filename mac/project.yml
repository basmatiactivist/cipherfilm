# The Xcode project for the Mac app, generated with XcodeGen (brew install xcodegen; then `xcodegen generate` in mac/).
# The app target compiles Sources/Cipherfilm and uses CipherfilmCore from Package.swift; run
# scripts/fetch-onnxruntime.sh first. CI builds it with xcodebuild (.github/workflows/mac.yml).
name: Cipherfilm
options:
  bundleIdPrefix: app.cipherfilm
  deploymentTarget: { macOS: "15.0" }
  createIntermediateGroups: true
packages:
  CipherfilmCore:
    path: .
targets:
  # not "Cipherfilm": the local package has an executable of that name, and xcodebuild -scheme would pick it
  CipherfilmApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/Cipherfilm
        # the map's page goes into Resources/map with MapLibre (scripts/map-assets.sh, below)
        excludes: [Info.plist, Cipherfilm.entitlements, Resources/map/**]
    # the map: its page, MapLibre GL JS from web/node_modules (`npm ci --ignore-scripts` in web/ first) and the place
    # names, into the app's Resources (before it is signed)
    postCompileScripts:
      - name: Map assets
        script: '"$SRCROOT/scripts/map-assets.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"'
        basedOnDependencyAnalysis: false
    dependencies:
      - package: CipherfilmCore
        product: CipherfilmCore
    settings:
      base:
        PRODUCT_NAME: Cipherfilm
        PRODUCT_MODULE_NAME: Cipherfilm
        PRODUCT_BUNDLE_IDENTIFIER: app.cipherfilm.mac
        # a release build gets the tag's version (.github/workflows/mac.yml)
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Sources/Cipherfilm/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Cipherfilm/Cipherfilm.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # the map assets script reads ../web (scripts/map-assets.sh)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "6.0"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
