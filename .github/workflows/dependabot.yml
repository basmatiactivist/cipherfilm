name: Dependabot
# Minor and patch updates from Dependabot merge themselves, but only through GitHub's own auto-merge: GitHub merges
# when every required check of the branch rule on master has passed for the pull request's latest commit (the unit
# tests, the browser suite, the plaintext leak check, the migration test). Major version jumps, and updates whose kind
# is unknown, are left open with a note: they can change behaviour (for the crypto libraries even the data format) and
# are reviewed by hand. The decision is made again for every new commit on the pull request: a grouped update that
# Dependabot refreshes and that now holds a major jump loses the auto-merge an earlier minor version armed. New
# versions only arrive after a cooldown (.github/dependabot.yml).
#
# This uses the plain pull_request trigger, as GitHub documents it for Dependabot: the job runs with the pull
# request's own token and runs none of its code. Auto-merge needs "Allow auto-merge" and the branch rule with the
# required checks (docs/RELEASING.md, "Repository settings"); without them the merge step only adds the label.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
# one run per pull request at a time: a newer push waits, so label, merge and comment of two runs never interleave
concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  triage:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == github.event.pull_request.head.repo.full_name
    runs-on: ubuntu-latest
    permissions:
      contents: write        # gh pr merge --auto (GitHub merges later, once the required checks pass)
      pull-requests: write   # the label and the comment
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # only what is known to be a minor or patch update merges by itself; anything else (major, a version Dependabot
      # can't classify, or no answer at all because the step above failed) waits for a person
      - name: Auto-merge minor and patch updates once the required checks pass
        if: contains(fromJSON('["version-update:semver-minor","version-update:semver-patch"]'), steps.meta.outputs.update-type)
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.html_url }}" }
        run: |
          gh pr edit "$PR" --add-label automerge
          gh pr merge "$PR" --auto --squash --delete-branch || echo "auto-merge is not enabled for this repository yet"
      - name: Leave major and unclassified updates for a person
        if: always() && !contains(fromJSON('["version-update:semver-minor","version-update:semver-patch"]'), steps.meta.outputs.update-type)
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.html_url }}", KIND: "${{ steps.meta.outputs.update-type }}" }
        run: |
          # auto-merge stays on a pull request until it is turned off: an earlier run may have armed it
          gh pr merge "$PR" --disable-auto || echo "auto-merge was not on"
          gh pr edit "$PR" --remove-label automerge || true
          what="Major version update"; [ "$KIND" = version-update:semver-major ] || what="Update of a kind Dependabot couldn't classify (${KIND:-unknown})"
          gh pr comment "$PR" --body "$what: not merged automatically. Read the changelogs, and for libsodium, x/crypto or sqlite check docs/CRYPTO.md and the test vectors before merging."
