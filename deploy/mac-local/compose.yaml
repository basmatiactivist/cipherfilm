# fotocrypt: your own Cipherfilm instance on this Mac (OrbStack).
# Reachable at https://fotocrypt.orb.local from this Mac only. Nothing is published to your network.
name: fotocrypt
services:
  app:
    image: fotocrypt:local
    container_name: fotocrypt-app
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    volumes:
      - ./data:/data            # the database and the encrypted files live here, in this folder
    environment:
      LISTEN_ADDR: ":8080"
      TRUST_PROXY: "0"
      PUBLIC_HOSTS: fotocrypt.orb.local   # requests for any other name (DNS rebinding) are refused
      MAP_STYLE: "${MAP_STYLE:-}"                        # from .env next to this file; empty: the default
      ANDROID_APP_CERTS: "${ANDROID_APP_CERTS:-}"        # passkeys of the Android app; empty: the official app
      ANDROID_APP_PACKAGES: "${ANDROID_APP_PACKAGES:-}"
    labels:
      dev.orbstack.domains: fotocrypt.orb.local
