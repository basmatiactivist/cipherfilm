name: Dependabot
# Minor and patch updates from Dependabot merge themselves, but only through GitHub's own auto-merge: GitHub merges
# when every required check of the branch rule on master has passed for the pull request's latest commit (the unit
# tests, the browser suite, the plaintext leak check, the migration test). Major version jumps are left open with a
# note: they can change behaviour (for the crypto libraries even the data format) and are reviewed by hand. New
# versions only arrive after a cooldown (.github/dependabot.yml).
#
# This uses the plain pull_request trigger, as GitHub documents it for Dependabot: the job runs with the pull
# request's own token and runs none of its code. Auto-merge needs "Allow auto-merge" and the branch rule with the
# required checks (docs/RELEASING.md, "Repository settings"); without them the merge step only adds the label.
on: pull_request
permissions:
  contents: read
jobs:
  triage:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == github.event.pull_request.head.repo.full_name
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Auto-merge minor and patch updates once the required checks pass
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.html_url }}" }
        run: |
          gh pr edit "$PR" --add-label automerge
          gh pr merge "$PR" --auto --squash --delete-branch || echo "auto-merge is not enabled for this repository yet"
      - name: Leave major updates for a person
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.html_url }}" }
        run: |
          gh pr comment "$PR" --body "Major version update: not merged automatically. Read the changelogs, and for libsodium, x/crypto or sqlite check docs/CRYPTO.md and the test vectors before merging."
