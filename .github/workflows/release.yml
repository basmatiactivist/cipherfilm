name: Release
# Push a tag like v1.0.0 and this builds the multi-arch image, publishes it to ghcr.io,
# builds the offline decrypt tool for every platform and creates the GitHub Release with notes, then puts the Android
# bundle on Google Play's internal testing track.
# Only a tag on a commit that is already on master is released. The jobs that sign or push run in the "release"
# environment, which holds the signing key and admits only v* tags; no job uses an Actions cache (docs/RELEASING.md).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  on-master:
    # first, before anything is built or signed: a tag on a commit that never reached master is not released
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }  # full history of every branch, for the check below
      - name: The tagged commit is on master
        run: |
          git merge-base --is-ancestor HEAD origin/master \
            || { echo "$GITHUB_REF_NAME points at $(git rev-parse HEAD), which is not on master: not released"; exit 1; }

  verify:
    needs: on-master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }  # no token left in .git for later steps
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27", cache: false }  # a release builds without caches: nothing earlier can slip in
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "26", package-manager-cache: false }
      - name: Tag matches the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no section '## [$v]'"; exit 1; }
      - name: Server tests
        run: mkdir -p server/static && cd server && go vet ./... && go test ./...
      - name: Web tests
        run: cd web && npm ci --ignore-scripts && npm run build && npm test
      - name: Decrypt tool tests
        run: cd tools/decrypt && go vet ./... && go test ./...
      - name: Uploader tests
        run: cd tools/upload && go vet ./... && go test ./...

  e2e:
    needs: on-master
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }  # no token left in .git for later steps
      - name: end-to-end tests and leak check
        run: make e2e

  image:
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }  # every release tag, for the order check below
      - name: Which floating tags this release may move
        id: order
        # a fix for an older line (v2.0.9 after v2.3.0) must not move :2 or :latest back to older code: X.Y, X and
        # latest move only when this is the highest release in that line (pre-releases never move them)
        run: |
          v="${GITHUB_REF_NAME#v}"
          # the highest final release whose version starts with $1 ("2.3.", "2." or "" for all)
          rel() { git tag -l 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | awk -v p="$1" 'index($0, p) == 1' | sort -V | tail -1; }
          top() { case "$v" in *-*) echo false ;; *) [ "$(rel "$1")" = "$v" ] && echo true || echo false ;; esac; }
          major="${v%%.*}"; rest="${v#*.}"; minor="$major.${rest%%.*}"
          { echo "minor=$(top "$minor.")"; echo "major=$(top "$major.")"; echo "latest=$(top "")"; } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # v1.2.3 -> 1.2.3, and 1.2, 1, latest where it is the newest (pre-releases like v1.2.3-rc.1 get only their own tag)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.order.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.order.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ steps.order.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=Cipherfilm
            org.opencontainers.image.description=Self-hosted, end-to-end encrypted photo and video gallery
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          no-cache: true  # every layer built in this run, none taken from an earlier one
      - name: Sign the build provenance (GitHub only offers this for public repositories)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  tool:
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }  # no token left in .git for later steps
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27", cache: false }  # a release builds without caches: nothing earlier can slip in
      - name: Build the offline decrypt tool and the Mac uploader
        run: |
          mkdir -p dist
          cd tools/decrypt
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../../dist/cipherfilm-decrypt-$os-$arch$ext" .
          done
          cd ../upload
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o ../../dist/cipherfilm-upload-darwin-$arch .
          done
          cd ../../dist && sha256sum cipherfilm-decrypt-* cipherfilm-upload-* > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: decrypt-tool, path: dist/ }

  android:
    # starts alongside the tests: it is the longest job, and the release still waits for every check. The signing key
    # lives in the "release" environment, which the job in android.yml uses; GitHub hands a called workflow
    # environment secrets only when the caller passes secrets on. The repository itself keeps no secrets, so this
    # passes nothing but what that environment (v* tags only) holds.
    needs: on-master
    uses: ./.github/workflows/android.yml
    with: { version: "${{ github.ref_name }}" }
    secrets: inherit  # zizmor: ignore[secrets-inherit] only the release environment's own secrets exist

  mac:
    # macOS runner, also alongside the tests
    needs: on-master
    uses: ./.github/workflows/mac.yml
    with: { version: "${{ github.ref_name }}" }

  release:
    needs: [image, tool, android, mac]
    # GitHub's macOS arm64 runners are sometimes not available for a long time: the release then goes out without the
    # Mac app, which is built locally (mac/scripts/bundle.sh) and attached with `gh release upload` (docs/RELEASING.md)
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.tool.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # signing the provenance of the attached files
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }  # no token left in .git for later steps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: decrypt-tool, path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: android-app, path: dist }
      - name: The Android app and its Play bundle are both there
        run: ls "dist/cipherfilm-android-${GITHUB_REF_NAME#v}.apk" "dist/cipherfilm-play-${GITHUB_REF_NAME#v}.aab"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.mac.result == 'success' }}
        with: { name: mac-app, path: dist }
      - name: Checksums for everything attached
        run: cd dist && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          {
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${v}"
            echo '```'
            echo
            echo "Image: \`ghcr.io/${GITHUB_REPOSITORY}:${v}\` (linux/amd64, linux/arm64), with provenance and SBOM. See the README for setup and updating."
            echo
            echo "Attached below: the Mac app (\`cipherfilm-mac-${v}.zip\`, Apple silicon, macOS 15 or newer; not signed by Apple yet, so the first start needs System Settings › Privacy & Security › Open Anyway), the Android app (\`cipherfilm-android-${v}.apk\`, arm64, Android 7 or newer; \`cipherfilm-play-${v}.aab\` is the same app as uploaded to Google Play), the offline decrypt tool (macOS, Linux, Windows), the Mac uploader (\`cipherfilm-upload-darwin-arm64\` / \`-amd64\`) and \`SHA256SUMS\`."
          } >> notes.md
      - name: No build paths or names in the files (docs/RELEASING.md)
        # built on GitHub's machines, where every build path is the CI user's (/home/runner, /Users/runner) and names
        # nobody; what must never be in a release is a person's home folder, so look for any other one
        env:
          CHECK_ARTIFACTS_ONLY_EXTRA: "1"
          CHECK_ARTIFACTS_EXTRA: '/Users/[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+|[A-Z]:\\Users\\[A-Za-z0-9._-]+'
          CHECK_ARTIFACTS_ALLOW: '^(/Users/runner|/home/runner|/Users/Shared|/home/linuxbrew|/Users/cloudtest)$'  # cloudtest: Microsoft's build machine, inside the ONNX Runtime it ships
        run: scripts/check-artifacts.sh dist/*
      - name: Sign the build provenance of every attached file (GitHub only offers this for public repositories)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "dist/*" }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the tag must still point at the commit that was built: a tag moved during the run is not released
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
          sha="${ref#* }"; [ "${ref% *}" = tag ] && sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
          [ "$sha" = "$(git rev-parse HEAD)" ] || { echo "$GITHUB_REF_NAME moved to $sha during the run: not released"; exit 1; }
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Cipherfilm ${GITHUB_REF_NAME#v}" --notes-file notes.md $pre --verify-tag

  play:
    # Google Play: the bundle just released goes to the internal testing track, with "What's new" from
    # docs/play/listing/<lang>/changelogs/<versionCode>.txt or else CHANGELOG.md (mobile/scripts/play-notes.sh).
    # Production is a separate, hand-started step (play-promote.yml). Not for pre-releases; without the service
    # account's key in the release environment it only warns (docs/RELEASING.md, "Google Play from CI").
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }  # no token left in .git for later steps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: android-app, path: dist }
      - name: Upload to the internal testing track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::no PLAY_SERVICE_ACCOUNT_JSON in the release environment: upload cipherfilm-play-$v.aab in Play Console by hand"
            exit 0
          fi
          mobile/scripts/play-notes.sh "$v" "$RUNNER_TEMP/notes"
          mobile/scripts/play.sh upload "dist/cipherfilm-play-$v.aab" internal "$RUNNER_TEMP/notes"
