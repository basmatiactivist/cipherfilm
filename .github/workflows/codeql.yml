name: CodeQL
# Static analysis of the server (Go), the web and Android JavaScript/TypeScript, and the workflows themselves. GitHub
# runs it for free on public repositories only; on a private one the jobs are skipped.
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
  schedule: [{ cron: "23 4 * * 1" }]
permissions:
  contents: read
jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: go, build-mode: manual }
          - { language: javascript-typescript, build-mode: none }
          - { language: actions, build-mode: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with: { go-version: "1.27", cache-dependency-path: server/go.sum }
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: { languages: "${{ matrix.language }}", build-mode: "${{ matrix.build-mode }}", queries: security-extended }
      - name: Build the Go code
        if: matrix.language == 'go'
        run: for d in server tools/decrypt tools/upload; do (cd $d && go build ./...); done
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: { category: "/language:${{ matrix.language }}" }
