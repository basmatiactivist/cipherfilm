# Updates arrive as one grouped pull request per area, weekly, and only for versions that have been out for a few
# days (cooldown): a hijacked package is usually found and pulled within hours, before it would reach us. Security
# updates are not limited by this file and open on their own. The crypto and storage libraries (libsodium, x/crypto, sqlite) are
# upgraded together with the others, but the pull request must pass the cross-implementation test
# vectors (make test) and the e2e suite before merging.
version: 2
# The e2e suite's Playwright library (npm, e2e/) and its browser image (compose.e2e.yaml) only work in the same version:
# one pull request moves both, after its cooldown.
multi-ecosystem-groups:
  e2e-stack:
    schedule: { interval: weekly }
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule: { interval: weekly }
    cooldown: { default-days: 7, semver-major-days: 30, semver-minor-days: 7, semver-patch-days: 3 }
    open-pull-requests-limit: 2
    groups: { go-server: { patterns: ["*"] } }
  - package-ecosystem: gomod
    directory: /tools/decrypt
    schedule: { interval: weekly }
    cooldown: { default-days: 7, semver-major-days: 30, semver-minor-days: 7, semver-patch-days: 3 }
    open-pull-requests-limit: 2
    groups: { go-decrypt: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    cooldown: { default-days: 7, semver-major-days: 30, semver-minor-days: 7, semver-patch-days: 3 }
    open-pull-requests-limit: 2
    groups: { web: { patterns: ["*"] } }
  - package-ecosystem: gomod
    directory: /tools/upload
    schedule: { interval: weekly }
    cooldown: { default-days: 7, semver-major-days: 30, semver-minor-days: 7, semver-patch-days: 3 }
    open-pull-requests-limit: 2
    groups: { go-upload: { patterns: ["*"] } }
  # the Android app: Expo pins React Native and its modules per SDK, so a pull request here is checked with
  # `npx expo install --check` before merging; SDK upgrades are done by hand (npx expo install expo@next --fix)
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly }
    cooldown: { default-days: 7, semver-major-days: 30, semver-minor-days: 7, semver-patch-days: 3 }
    open-pull-requests-limit: 2
    groups: { mobile: { patterns: ["*"] } }
  # the app's own native libraries: Media3 (video player), JNA, ExifInterface
  - package-ecosystem: gradle
    directory: /mobile/modules/cf-native/android
    schedule: { interval: weekly }
    cooldown: { default-days: 7, semver-major-days: 30, semver-minor-days: 7, semver-patch-days: 3 }
    open-pull-requests-limit: 2
    groups: { android-native: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /e2e
    cooldown: { default-days: 7, semver-major-days: 30, semver-minor-days: 7, semver-patch-days: 3 }
    multi-ecosystem-group: e2e-stack
    patterns: ["*"]
  # the base images, pinned by tag and digest: an update moves both
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # docker, docker-compose and github-actions take no per-semver days
    open-pull-requests-limit: 2
    groups: { docker: { patterns: ["*"] } }
  # images in the compose files: Caddy and the Playwright browsers of the e2e stack.
  # The helper images in the Makefile and scripts/ (alpine, golang, node) are not seen by Dependabot;
  # docs/RELEASING.md lists them.
  - package-ecosystem: docker-compose
    directory: /
    cooldown: { default-days: 7 }   # docker, docker-compose and github-actions take no per-semver days
    multi-ecosystem-group: e2e-stack
    patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # docker, docker-compose and github-actions take no per-semver days
    open-pull-requests-limit: 2
    groups: { actions: { patterns: ["*"] } }
  # Not here: the Mac app (swift). Its package needs the ONNX Runtime framework that scripts/fetch-onnxruntime.sh
  # downloads, so Dependabot can't resolve it; swift-sodium is checked by hand (docs/RELEASING.md). Security alerts
  # for it still come from the dependency graph.
