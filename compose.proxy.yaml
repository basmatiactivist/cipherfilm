# Overlay: you already run a reverse proxy (nginx, Caddy, Traefik, a Cloudflare Tunnel, ...) that provides HTTPS.
# The app listens on 127.0.0.1 only; point your proxy at http://127.0.0.1:${APP_PORT}.
# With exactly ONE proxy in front, keep TRUST_PROXY=1 so login limits see real client addresses.
# Behind a Cloudflare Tunnel or a chain of proxies set TRUST_PROXY=0.
# PUBLIC_HOSTS (the name your proxy serves) is required: X-Forwarded-For is only taken for requests to it, and only
# from TRUSTED_PROXIES (addresses or CIDRs; empty = loopback and private networks, which covers a proxy on this host).
services:
  app:
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      PUBLIC_HOSTS: "${PUBLIC_HOSTS:?set PUBLIC_HOSTS in .env to the name your proxy serves, e.g. photos.example.com}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
