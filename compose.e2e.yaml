# End-to-end test stack: the app behind Caddy with a locally issued HTTPS certificate, and Playwright.
# Self-contained (no OrbStack, no published ports), so it runs the same on a laptop and in GitHub CI,
# and never touches the dev stack. Used by `make e2e`.
name: cipherfilm-e2e
services:
  app:
    build: .
    image: cipherfilm:e2e
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - appdata:/data
    environment:
      LISTEN_ADDR: ":8080"
      DEMO_ACCOUNTS: demo@example.org   # the read-only public demo login (zdemo.spec.ts)
  proxy:
    image: caddy:2.11.8-alpine
    command: caddy reverse-proxy --from cipherfilm.test --to app:8080 --internal-certs
    depends_on: [app]
    networks:
      default:
        aliases: [cipherfilm.test]
  playwright:
    # the browsers must match @playwright/test in e2e/package.json, which `make` reads (the only place to bump it)
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:?run through make, which reads it from e2e/package.json}-noble
    profiles: [test]
    depends_on: [proxy]
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
      - ./server/explicit-filter.json:/server/explicit-filter.json:ro   # the explicit filter's concepts (zzzzzzzzcontent.spec.ts)
    environment:
      BASE_URL: https://cipherfilm.test
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      CI: ${CI:-}
    command: sh -c 'npm ci --silent && npx playwright test'
volumes:
  appdata:
