name: Android
# Builds the signed APK (GitHub releases, Obtainium; signed with the app signing key) and the Android App Bundle for
# Google Play (CF_STORE=play, signed with the key Play takes for uploads; Play App Signing re-signs it with the app signing key,
# docs/RELEASING.md), and checks both for 16 KB memory pages. Called by the release workflow for a tag; can also be run by hand on a v* tag (Actions >
# Android > Run workflow) to check the build without releasing. No Actions caches at all: what goes into the signed
# app is fetched fresh and checked against a pinned hash (the NDK and Gradle here, libsodium in its build script, npm
# through the lockfile), so nothing another job left behind can slip in. The signing key is a secret of the "release"
# environment (docs/RELEASING.md), and so is the upload key.
on:
  workflow_call:
    inputs:
      version: { type: string, required: true }
    outputs:
      # the files' checksums: the release job publishes only files that match them
      sums: { value: "${{ jobs.apk.outputs.sums }}" }
  workflow_dispatch:
    inputs:
      version: { type: string, required: true, default: "0.0.0", description: "versionName for the test build" }
permissions:
  contents: read
env:
  NDK: "30.0.16248370"
  # android-ndk-r30-linux.zip; Google's index lists its SHA-1 5107f898313790e449e87eee2183d9a20602dee9
  NDK_ZIP: android-ndk-r30-linux.zip
  NDK_SHA256: 753611f410d002cfcd3f3dc2ef49aad532089d3180b436c060a90bf0fcb64df2
  # the Gradle that expo prebuild writes into the wrapper; a new version fails the build until it is pinned here
  GRADLE_DIST: gradle-9.4.1-bin.zip
  GRADLE_SHA256: 2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb
  VERSION: ${{ inputs.version }}
  # the app signing key's certificate (docs/RELEASING.md); Play App Signing signs with the same key
  RELEASE_CERT_SHA256: 87d9e9ab855b03e7d7d3152f5a76a4d8afb5d38efca3b9932ad93f1ba17c6712
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }  # no token left in .git for later steps
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "26", package-manager-cache: false }
      - name: Install the NDK (pinned hash)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfO "https://dl.google.com/android/repository/$NDK_ZIP"
          echo "$NDK_SHA256  $NDK_ZIP" | sha256sum -c - >/dev/null
          unzip -q "$NDK_ZIP" && rm "$NDK_ZIP"
          grep -q "^Pkg.Revision = $NDK" android-ndk-*/source.properties
          rm -rf "$ANDROID_HOME/ndk/$NDK" && mkdir -p "$ANDROID_HOME/ndk" && mv android-ndk-* "$ANDROID_HOME/ndk/$NDK"
      - name: libsodium from the signed release
        run: |
          sudo apt-get install -y -qq minisign >/dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK" mobile/modules/cf-native/scripts/build-libsodium.sh
      - name: JavaScript dependencies and native project
        run: |
          cd mobile && npm ci --ignore-scripts
          CF_VERSION="${VERSION#v}" npx expo prebuild --platform android --clean --no-install
      - name: Gradle only with the pinned hash
        run: |
          props=mobile/android/gradle/wrapper/gradle-wrapper.properties
          grep -qx "distributionUrl=https\\\\://services.gradle.org/distributions/$GRADLE_DIST" "$props" \
            || { echo "the wrapper wants another Gradle: pin its hash in android.yml"; grep distributionUrl "$props"; exit 1; }
          echo "distributionSha256Sum=$GRADLE_SHA256" >> "$props"
          # the Play build's prebuild writes the wrapper again: it must be this one, the one validated below
          sha256sum mobile/android/gradle/wrapper/gradle-wrapper.jar | cut -d" " -f1 > "$RUNNER_TEMP/wrapper.sha256"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: { cache-disabled: true, validate-wrappers: true }  # the wrapper jar must be one Gradle released
      - name: Build and sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          trap 'rm -f "$RUNNER_TEMP/release.p12"' EXIT
          cd mobile/android
          CF_VERSION="${VERSION#v}" CF_KEYSTORE="$RUNNER_TEMP/release.p12" ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a --parallel --console=plain
          mkdir -p ../../dist && cp app/build/outputs/apk/release/app-release.apk "../../dist/cipherfilm-android-${VERSION#v}.apk"
      - name: Native project for Google Play
        # CF_STORE=play: no REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, no explicit search model (app.config.js, src/store.ts)
        run: |
          cd mobile
          CF_STORE=play CF_VERSION="${VERSION#v}" npx expo prebuild --platform android --clean --no-install
          props=android/gradle/wrapper/gradle-wrapper.properties
          grep -qx "distributionUrl=https\\\\://services.gradle.org/distributions/$GRADLE_DIST" "$props" \
            || { echo "the wrapper wants another Gradle: pin its hash in android.yml"; grep distributionUrl "$props"; exit 1; }
          echo "distributionSha256Sum=$GRADLE_SHA256" >> "$props"
          [ "$(sha256sum android/gradle/wrapper/gradle-wrapper.jar | cut -d" " -f1)" = "$(cat "$RUNNER_TEMP/wrapper.sha256")" ] \
            || { echo "the Play build's Gradle wrapper differs from the validated one"; exit 1; }
      - name: Build the App Bundle for Google Play
        # signed with the key Play Console has registered as upload key: the app signing key until Play accepted the
        # separate upload key (upload key reset, docs/RELEASING.md), then the upload key once the release environment
        # has the variable PLAY_UPLOAD_KEY=upload
        env:
          PLAY_UPLOAD_KEY: ${{ vars.PLAY_UPLOAD_KEY }}
          UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "$PLAY_UPLOAD_KEY" = upload ]; then
            echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/play.p12"; export CF_KEYSTORE_PASSWORD="$UPLOAD_KEYSTORE_PASSWORD" CF_KEY_ALIAS=upload
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/play.p12"; export CF_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          fi
          unset UPLOAD_KEYSTORE_B64 UPLOAD_KEYSTORE_PASSWORD KEYSTORE_B64 KEYSTORE_PASSWORD
          trap 'rm -f "$RUNNER_TEMP/play.p12"' EXIT
          cd mobile/android
          # CF_STORE=play here too: the build writes the app's config (extra.store) again, from app.config.js
          CF_STORE=play CF_VERSION="${VERSION#v}" CF_KEYSTORE="$RUNNER_TEMP/play.p12" ./gradlew bundleRelease \
            -PreactNativeArchitectures=arm64-v8a --parallel --console=plain
          ../scripts/check-play-manifest.sh app
          cp app/build/outputs/bundle/release/app-release.aab "../../dist/cipherfilm-play-${VERSION#v}.aab"
      - name: Signatures (APK with the app signing key, AAB with the key Play takes)
        env:
          PLAY_UPLOAD_KEY: ${{ vars.PLAY_UPLOAD_KEY }}
        run: |
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=$("$bt/apksigner" verify --print-certs dist/cipherfilm-android-*.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          aab=$(keytool -printcert -jarfile dist/cipherfilm-play-*.aab | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d : | tr A-F a-f)
          echo "APK: $apk"; echo "AAB: $aab"
          [ "$apk" = "$RELEASE_CERT_SHA256" ] || { echo "the APK is not signed with the app signing key"; exit 1; }
          if [ "$PLAY_UPLOAD_KEY" = upload ]; then
            [ -n "$aab" ] && [ "$aab" != "$RELEASE_CERT_SHA256" ] || { echo "the AAB must be signed with the upload key"; exit 1; }
          else
            [ "$aab" = "$RELEASE_CERT_SHA256" ] || { echo "the AAB must be signed with the app signing key"; exit 1; }
          fi
      - name: 16 KB memory pages (Google Play)
        run: |
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/zipalign" ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK" \
            mobile/scripts/check-page-size.sh dist/cipherfilm-android-*.apk dist/cipherfilm-play-*.aab
      - name: Checksums for the release job
        id: sums
        run: cd dist && echo "sums=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: android-app, path: dist/ }
