# Overlay: private access through Tailscale. The only port published on the host is Tailscale's own WireGuard port
# (UDP, encrypted tailnet traffic only): with it, devices connect directly instead of through Tailscale's relays, which
# can be very slow (a 250 MB search model took 15 minutes). Set TS_UDP_PORT= to another port if 41641 is taken.
# The app shares the Tailscale container's network namespace; Tailscale Serve terminates HTTPS on your
# tailnet name and forwards to the app on 127.0.0.1:8080 (see deploy/tailscale/serve.json).
# Needs in .env: TS_AUTHKEY, TS_HOSTNAME. Admin console: enable HTTPS certificates (and MagicDNS).
services:
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.104.4}
    hostname: ${TS_HOSTNAME:-photos}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env (Tailscale admin console > Settings > Keys)}
      TS_HOSTNAME: ${TS_HOSTNAME:-photos}
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"          # log in with the key only the first time; state is persisted afterwards
      # kernel networking: Linux's own TCP instead of Tailscale's userspace stack, which held downloads to about
      # 2 MB/s over a long route (a server in another continent); it needs the tun device and two capabilities
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_TAILSCALED_EXTRA_ARGS: "--port=${TS_UDP_PORT:-41641}"
    ports:
      - "${TS_UDP_PORT:-41641}:${TS_UDP_PORT:-41641}/udp"
    volumes:
      - tsstate:/var/lib/tailscale
      - ./deploy/tailscale:/config:ro   # Tailscale wants the config mounted as a directory
    devices: ["/dev/net/tun:/dev/net/tun"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]   # create the tailscale0 interface and its routes (only in this container's namespace)
  app:
    network_mode: service:tailscale
    depends_on: [tailscale]
    environment:
      LISTEN_ADDR: "127.0.0.1:8080"   # only Serve (and Caddy) in this namespace reach it, not tailnet peers directly
      TRUST_PROXY: "0"   # Tailscale Serve does not document X-Forwarded-For, so per-IP limits are not used here

volumes:
  tsstate:
    name: ${TS_STATE_VOLUME:-cipherfilm_tsstate}
