# Cipherfilm in one file: the released image, on 127.0.0.1 only. It does not provide HTTPS: put any reverse proxy
# with HTTPS in front (Caddy, nginx, Traefik, a Cloudflare Tunnel, Tailscale Serve, ...) and point it at
# http://127.0.0.1:8080. Proxy requirements: docs/SELF-HOSTING.md. Built from source instead: docs/SELF-HOSTING.md.
name: cipherfilm-prod

services:
  app:
    image: ${CIPHERFILM_IMAGE:-ghcr.io/basmatiactivist/cipherfilm:2}   # :2 follows every 2.x release; :X.Y.Z pins one
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    ports:
      # loopback by default: reachable just through a proxy on this host. A proxy in a Docker container reaches it with
      # APP_BIND set to the Docker bridge's address (e.g. 172.17.0.1, the host as containers see it)
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - appdata:/data
    environment:
      LISTEN_ADDR: ":8080"
      # the name(s) your proxy serves; requests for any other name are refused (DNS rebinding), and X-Forwarded-For
      # is only taken for requests to these names
      PUBLIC_HOSTS: "${PUBLIC_HOSTS:?set PUBLIC_HOSTS in .env to the name your proxy serves, e.g. photos.example.com}"
      # 1 with exactly ONE proxy in front that adds X-Forwarded-For, so login limits see real client addresses.
      # 0 behind a chain of proxies, a Cloudflare Tunnel or Tailscale Serve.
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      # peers whose X-Forwarded-For is believed (addresses or CIDRs); empty: loopback and private networks
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      # 1 behind Tailscale Serve (TRUST_PROXY=0): limit sign-ins per tailnet user (Tailscale-User-Login) instead of
      # all as 127.0.0.1; only if nothing else that passes on client headers reaches the app on loopback
      TRUST_TAILSCALE_HEADERS: "${TRUST_TAILSCALE_HEADERS:-0}"
      DEMO_ACCOUNTS: "${DEMO_ACCOUNTS:-}" # public read-only demo logins (deploy/demo); normally empty
      DEMO_LOGIN: "${DEMO_LOGIN:-}"       # "EMAIL PASSWORD" of one of them, shown on the sign-in page; normally empty

volumes:
  appdata:
    name: ${DATA_VOLUME:-cipherfilm_data}
