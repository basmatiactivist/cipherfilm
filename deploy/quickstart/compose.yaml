# Cipherfilm in one file: the released image plus Caddy for automatic HTTPS (Let's Encrypt).
# Needs a DNS name pointing at this machine and ports 80 and 443 reachable. Put the name in .env:
#   DOMAIN=photos.example.com
# then: docker compose up -d && docker compose logs app | grep "FIRST-TIME SETUP"
# Private use without open ports (Tailscale) or behind your own proxy: see the README in the repository.
name: cipherfilm

services:
  app:
    image: ghcr.io/basmatiactivist/cipherfilm:${CIPHERFILM_TAG:-2}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    volumes:
      - data:/data
    environment:
      LISTEN_ADDR: ":8080"
      TRUST_PROXY: "1"              # exactly one proxy in front: Caddy
      PUBLIC_HOSTS: "${DOMAIN:?set DOMAIN in .env, e.g. photos.example.com}"

  caddy:
    image: caddy:2.11.7-alpine   # a fixed version: the app relies on how it sets X-Forwarded-For
    restart: unless-stopped
    # The app sets its own security headers; Caddy only gets the certificate, terminates TLS and forwards, with the
    # real client address as the only X-Forwarded-For entry.
    command: 'caddy reverse-proxy --from ${DOMAIN} --to app:8080 --header-up "X-Forwarded-For: {http.request.remote.host}"'
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # ports 80 and 443
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 256m

volumes:
  data:
    name: cipherfilm_data
  caddy_data:
    name: cipherfilm_caddy_data
  caddy_config:
